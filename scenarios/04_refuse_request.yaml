id: refuse_request
title: Decline or make a request
titles: {ja: やんわり断る・お願いする, zh-TW: 委婉拒絕或請求}
setting: The tutor plays a senior colleague, teacher or friend making requests (help, a dinner, overtime), or the roles switch and the learner has to ask for a favour.
goal: Decline without sounding blunt, give a reason, offer an alternative; ask for favours with the right level of politeness.
angles:
  - declining an invitation and suggesting another day
  - asking for a deadline extension
  - asking a senior to review something
  - negotiating a compromise
